name: Native Translation Regressions

on:
  pull_request:
    paths:
      - ".github/workflows/source-color.yml"
      - "Aidoku/Core/Translation/**"
      - "Aidoku.xcodeproj/**"
      - "AidokuFast.xctestplan"
      - "AidokuFull.xctestplan"
      - "Scripts/verify_native_quality_result.py"
      - "Aidoku/Features/Reader/Translation/**"
      - "AidokuTests/Translation/**"
      - "Scripts/image-translation.swift"
      - "Scripts/image-translation/**"
      - "Scripts/overlay-kernels/**"
      - "Vendor/HoshiDicts/**"
      - "Scripts/test_*.py"
      - "Scripts/tests/**"
      - "Scripts/tests/run-image-*.py"

permissions:
  contents: read

jobs:
  native-host:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Set up native pixel kernel toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test native host renderer, CLI and native checks
        run: python3 Scripts/test_quick.py --full-host --host-result-directory "$RUNNER_TEMP/aidoku-full-host-results"
      - name: Preserve every host command result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-full-host-results
          path: ${{ runner.temp }}/aidoku-full-host-results
          if-no-files-found: warn

  native-quality:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Set up native pixel kernel toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Select an available iOS simulator
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          state = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', '--json']))
          runtimes = {}
          for runtime in state['runtimes']:
              version = tuple(int(value) for value in re.findall(r'\d+', runtime.get('version', '')))
              if runtime.get('isAvailable') and runtime['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-') and version >= (26,):
                  runtimes[runtime['identifier']] = version
          candidates = [(runtimes[runtime], device['name'], device['udid'], device['state'])
                        for runtime, devices in state['devices'].items() if runtime in runtimes
                        for device in devices if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iOS26+ iPhone simulator; native quality verification cannot be skipped.')
          version, name, udid, status = max(candidates)
          if status != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', udid], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', udid, '-b'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('AIDOKU_QUALITY_SIMULATOR=' + udid + '\n')
          print('Native quality simulator:', name, version, udid)
          PYTHON
      - name: Test complete native restoration quality matrices
        run: |
          python3 Scripts/test_quick.py --ios NativeSourceSegmentationMatrixTests NativeSlantedRestorationMatrixTests NativeSourceOwnershipMatrixTests \
            --configuration Release --device "$AIDOKU_QUALITY_SIMULATOR" --jobs 2 \
            --derived-data build/simulator-fast-release --result-bundle "$RUNNER_TEMP/aidoku-native-quality.xcresult"
      - name: Require all three suites and every parameter case
        if: always()
        run: |
          python3 Scripts/verify_native_quality_result.py "$RUNNER_TEMP/aidoku-native-quality.xcresult" \
            --output "$RUNNER_TEMP/aidoku-native-quality.coverage.json"
      - name: Preserve native quality execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-restoration-quality-results
          path: ${{ runner.temp }}/aidoku-native-quality*
          if-no-files-found: error
